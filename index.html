<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>开奖记录抓取器 V4</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #0000000c}
h1{font-size:23px;margin:0 0 6px}.sub{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
label{font-size:12px;color:#6b7280;display:block;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f9fafb;border-radius:12px;padding:12px}.v{font-size:22px;font-weight:750}
.progress{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#111827;transition:.2s}
#log{white-space:pre-wrap;background:#0b1020;color:#d1fae5;border-radius:12px;padding:12px;max-height:230px;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 5px;border-bottom:1px solid #eee;text-align:center}th{position:sticky;top:0;background:white}
.tablewrap{max-height:420px;overflow:auto}.ok{color:#047857}.bad{color:#b91c1c}
@media(max-width:720px){.grid,.stats{grid-template-columns:1fr 1fr}.wrap{padding:10px}.card{padding:14px}}
</style>
</head>
<body><div class="wrap">
<div class="card">
  <h1>开奖记录抓取器 <small style="font-size:12px;color:#6b7280">V4</small></h1>
  <div class="sub">支持快乐8、福彩3D、七乐彩。七乐彩保留接口原始号码顺序，用于核对是否为落球顺序。</div>
  <div class="grid">
    <div><label>彩种</label><select id="lottery" style="width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white"><option value="klb">快乐8</option><option value="fcsd">福彩3D</option><option value="qlc">七乐彩（汇鸟升序）</option><option value="qlc500">七乐彩（500网落球顺序）</option></select></div>
    <div><label>年份</label><input id="year" type="number" value="2026"></div>
    <div><label>每页数量</label><input id="limit" type="number" value="100" min="1" max="500"></div>
    <div><label>起始页</label><input id="startPage" type="number" value="1" min="1"></div>
    <div><label>最大页数（保险）</label><input id="maxPages" type="number" value="20" min="1"></div>
  </div>
  <div class="actions">
    <button class="primary" id="fetchBtn">开始抓取</button>
    <button class="secondary" id="csvBtn" disabled>导出 CSV</button>
    <button class="secondary" id="copyBtn" disabled>复制 CSV</button>
    <button class="danger" id="clearBtn">清空</button>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="card stats">
 <div class="stat"><label>抓到记录</label><div class="v" id="count">0</div></div>
 <div class="stat"><label>年份内记录</label><div class="v" id="yearCount">0</div></div>
 <div class="stat"><label>最早日期</label><div class="v" id="minDate">-</div></div>
 <div class="stat"><label>最新日期</label><div class="v" id="maxDate">-</div></div>
</div>

<div class="card" id="outballBox" style="display:none"><b>500网七乐彩落球顺序测试</b><p class="sub">优先尝试直接读取500网出球顺序页面。若浏览器阻止跨域访问，可在下方粘贴该网页复制的开奖表格文本，或粘贴网页HTML源码后解析。页面默认可能只有最近30期；未覆盖全年时不会冒充全年已抓取。</p><p><a href="https://datachart.500star.com/qlc/history/outball.shtml" target="_blank" rel="noopener">打开500网七乐彩出球顺序</a></p><textarea id="paste500" placeholder="粘贴500网表格文本或网页HTML。示例：26124 2026-10-28 06 04 22 11 26 02 12 02 04 06 11 12 22 26 27" style="width:100%;min-height:110px;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:14px"></textarea><button id="parse500" style="margin-top:8px">解析粘贴的落球顺序</button></div><div class="card"><b>运行日志</b><div id="log" style="margin-top:10px">等待开始…</div></div>
<div class="card"><div class="sub" style="margin-bottom:8px">七乐彩（汇鸟）仅为升序；七乐彩（500网）n1～n7 是网站明确标注的出球顺序，sp 为特别号。请核对记录数量与日期。</div><b id="previewTitle">2026 年快乐8数据预览</b><div class="tablewrap" style="margin-top:10px"><table id="table"></table></div></div>
</div>

<script>
const HUINIAO_API = 'https://api.huiniao.top/interface/home/lotteryHistory';
let rows = [];
const $ = id => document.getElementById(id);
function log(s){ $('log').textContent += '\n' + s; $('log').scrollTop=$('log').scrollHeight; }
function pick(obj, names){ for(const n of names){ if(obj[n]!==undefined && obj[n]!==null && obj[n]!=='') return obj[n]; } return null; }
function currentType(){ return $('lottery').value; }
function isQlc(){ return ['qlc','qlc500'].includes(currentType()); }
function currentName(){ return ({klb:'快乐8',fcsd:'福彩3D',qlc:'七乐彩（升序）',qlc500:'七乐彩（落球顺序）'})[currentType()]; }
function expectedCount(){ return currentType()==='fcsd' ? 3 : (isQlc()?8:20); }
function maxNumber(){ return currentType()==='fcsd' ? 9 : (isQlc()?30:80); }
function normalizeHuiniao(item){
  const issue = String(pick(item,['code','issue','expect','period','lottery_no']) ?? '');
  const date = String(pick(item,['day','date','open_date','opendate']) ?? '').slice(0,10);
  let nums=[]; const direct=pick(item,['numbers','number','openCode','open_code','result','red']);
  if(Array.isArray(direct)) nums=direct.map(Number); else if(typeof direct==='string') nums=direct.match(/\d+/g)?.map(Number)||[];
  const names=['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
  if(nums.length<expectedCount()) nums=names.slice(0,expectedCount()).map(k=>item[k]).filter(v=>v!==undefined&&v!==null&&v!=='').map(Number);
  // 七乐彩：有些接口将特别号单独放在 blue / special 等字段，不能误当成第8个基本号。
  if(isQlc() && nums.length===7){
    const special=pick(item,['special','specialNumber','special_number','blue','blueBall','blue_ball','sp','extra','bonus']);
    if(special!==null){const m=String(special).match(/\d+/);if(m)nums.push(Number(m[0]));}
  }
  return {issue,date,nums,raw:JSON.stringify(item)};
}
function validRow(r){
  const need=expectedCount(), max=maxNumber();
  const base=r.issue && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.nums.length===need && r.nums.every(n=>Number.isInteger(n)&&n>=0&&n<=max);
  if(!base) return false;
  if(currentType()==='fcsd') return true;
  return r.nums.every(n=>n>=1) && new Set(r.nums).size===need;
}
function yearRows(){ const y=String($('year').value); return rows.filter(r=>r.date.startsWith(y)).sort((a,b)=>a.date.localeCompare(b.date)||a.issue.localeCompare(b.issue)); }
function render(){
  const yr=yearRows(); $('count').textContent=rows.length; $('yearCount').textContent=yr.length;
  $('minDate').textContent=yr[0]?.date||'-'; $('maxDate').textContent=yr.at(-1)?.date||'-'; $('csvBtn').disabled=!yr.length; $('copyBtn').disabled=!yr.length;
  $('previewTitle').textContent=`${$('year').value} 年${currentName()}数据预览`;
  let head;
  if(isQlc()) head=['期号','日期','n1','n2','n3','n4','n5','n6','n7','sp']; else head=['期号','日期',...Array.from({length:expectedCount()},(_,i)=>'n'+(i+1))];
  $('table').innerHTML='<thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+yr.slice().reverse().map(r=>'<tr><td>'+r.issue+'</td><td>'+r.date+'</td>'+r.nums.map(n=>'<td>'+String(n).padStart(2,'0')+'</td>').join('')+'</tr>').join('')+'</tbody>';
}
function csvText(){
  const yr=yearRows();
  const header=isQlc()?'issue,date,n1,n2,n3,n4,n5,n6,n7,sp':'issue,date,'+Array.from({length:expectedCount()},(_,i)=>'n'+(i+1)).join(',');
  return [header,...yr.map(r=>[r.issue,r.date,...r.nums.map(n=>String(n).padStart(2,'0'))].join(','))].join('\n');
}
$('lottery').onchange=()=>{ $('outballBox').style.display=currentType()==='qlc500'?'block':'none'; rows=[]; $('log').textContent=`已切换到${currentName()}。`; $('bar').style.width='0'; render(); };
$('fetchBtn').onclick=async()=>{
  rows=[]; render(); $('log').textContent='开始抓取…'; $('fetchBtn').disabled=true;
  const year=Number($('year').value), limit=Number($('limit').value), start=Number($('startPage').value), max=Number($('maxPages').value);
  try{
      if(currentType()==='qlc500'){await fetch500();return;}
      let seen=new Set(),foundOlder=false;
      for(let page=start;page<start+max;page++){
        $('bar').style.width=((page-start)/max*100)+'%'; const url=`${HUINIAO_API}?type=${currentType()}&page=${page}&limit=${limit}`; log(`第 ${page} 页：请求中…`);
        const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error(`HTTP ${res.status}`); const json=await res.json(); if(Number(json.code)!==1) throw new Error(json.info||'接口返回失败');
        const list=json?.data?.data?.list; if(!Array.isArray(list)||!list.length){log('没有更多数据，停止。');break;}
        if(isQlc() && page===start){log('七乐彩接口首条原始记录（供核对号码字段和顺序）：');log(JSON.stringify(list[0],null,2));}
        let pageYears=[]; let invalid=0; for(const item of list){const r=normalizeHuiniao(item);if(!validRow(r)){invalid++;continue;}pageYears.push(Number(r.date.slice(0,4)));const key=r.issue+'|'+r.date;if(!seen.has(key)){seen.add(key);rows.push(r);}}
        log(`第 ${page} 页：有效 ${pageYears.length} 条；未识别 ${invalid} 条；累计 ${rows.length} 条。`); render(); if(pageYears.some(y=>y<year))foundOlder=true; if(foundOlder&&!pageYears.some(y=>y>=year)){log(`已翻到 ${year} 年以前，自动结束。`);break;}
        const totalPage=Number(json?.data?.data?.totalPage||0);if(totalPage&&page>=totalPage)break;await new Promise(r=>setTimeout(r,250));
      }
    log(`完成：${year} 年 ${yearRows().length} 期。`);
  }catch(e){ log('抓取失败：'+e.message); log('如果显示 Failed to fetch / CORS，说明数据源禁止 GitHub Pages 跨域直连，需要再加同源代理。'); }
  finally{$('bar').style.width='100%';$('fetchBtn').disabled=false;render();}
};

function parse500Text(text){
  // 500网出球顺序表：期号 日期 [7个落球号] [7个升序号] [特别号]
  // 只接受具有两组号码且两组集合完全相同的行，杜绝把升序误当落球顺序。
  const found=[];let rejected=0;
  const normalized=text.replace(/<\/tr\s*>/gi,'\n').replace(/<\/t[dh]\s*>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/\u00a0/g,' ');
  for(const line of normalized.split(/\r?\n/)){
    const match=line.replace(/\t/g,' ').replace(/\s+/g,' ').match(/(?:^|\s)(\d{5,7})\s+(20\d{2}-\d{2}-\d{2})\s+((?:\d{1,2}\s+){14}\d{1,2})(?=\s|$)/);
    if(!match)continue;
    const nums=match[3].trim().split(/\s+/).map(Number),ball=nums.slice(0,7),sorted=nums.slice(7,14),sp=nums[14];
    if(nums.length!==15||ball.some(n=>n<1||n>30)||sp<1||sp>30||new Set([...ball,sp]).size!==8||ball.slice().sort((a,b)=>a-b).join(',')!==sorted.join(',')){rejected++;continue;}
    found.push({issue:match[1],date:match[2],nums:[...ball,sp],raw:line});
  }
  return {found,rejected};
}
function merge500(parsed){
  const before=rows.length,byKey=new Map(rows.map(r=>[r.issue+'|'+r.date,r]));
  for(const r of parsed.found)byKey.set(r.issue+'|'+r.date,r);
  rows=[...byKey.values()];render();
  log(`500网落球顺序：识别 ${parsed.found.length} 期，校验拒绝 ${parsed.rejected} 行；新增 ${rows.length-before} 期；${$('year').value} 年合计 ${yearRows().length} 期。`);
  if(parsed.found.length===0)log('未识别到有效记录。请复制500网“出球顺序”表格文本（含期号、日期、两组7号码和特别号），或尝试粘贴网页源码。');
}
async function fetch500(){
  const url='https://datachart.500star.com/qlc/history/outball.shtml';
  log('尝试直接读取500网出球顺序页面（可能因CORS失败）…');
  try{
    const resp=await fetch(url,{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const html=await resp.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const lines=[...doc.querySelectorAll('tr')].map(tr=>tr.innerText||tr.textContent||'').join('\n');
    merge500(parse500Text(lines));
  }catch(e){log('500网无法从GitHub Pages直接跨域读取：'+e.message);log('请打开上方500网链接，将表格内容复制粘贴后点击“解析粘贴的落球顺序”；若需自动抓取全年，需要同源代理及历史范围请求的进一步验证。');}
}
$('parse500').onclick=()=>{if(currentType()!=='qlc500')return;merge500(parse500Text($('paste500').value));};

$('csvBtn').onclick=()=>{const text='\ufeff'+csvText(),blob=new Blob([text],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${currentName()}_${$('year').value}.csv`;a.click();URL.revokeObjectURL(a.href);};
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(csvText());log('CSV 已复制到剪贴板。');};
$('clearBtn').onclick=()=>{rows=[];$('log').textContent='已清空。';$('bar').style.width='0';render();};
render();
</script></body></html>
